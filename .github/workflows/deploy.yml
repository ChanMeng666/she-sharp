name: Deploy to Vercel

on:
  push:
    branches: [main]

# Only the newest commit on `main` needs to reach production, and a superseded
# build is pure cost: 20% of the deploys measured over 2026-08-13..09-01 (28 of
# 137) were still running when a later push arrived, and one burst on 08-30 ran
# eight full production builds inside sixty seconds. Cancelling is safe here
# because the run that supersedes one deploys the newer commit anyway.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_B067BUpWFoVPBxfQ0TWllunK
  VERCEL_PROJECT_ID: prj_DVjZnBzzL4tFpc5VME7bY6Q6wtAm
  # Pinned, not `latest`: `latest` re-resolved on every run, so the CLI could
  # change under a deploy without a commit, and it defeats the cache below.
  VERCEL_CLI_VERSION: '59.10.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Was the GitHub default of 360 minutes. One hung build at that ceiling is
    # 18% of the org's monthly Actions allowance. The worst legitimate case is
    # the font retry below — three builds plus two 60s waits, about nine
    # minutes — so 15 leaves headroom and still fails fast on a hang.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # No `version:` here on purpose — `packageManager` in package.json is the
      # single source, so a local machine and CI cannot drift apart.
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      # `npm install -g vercel@latest` spent 22s re-downloading the CLI on every
      # one of ~216 monthly runs. Cached against the pinned version above, a hit
      # costs about two seconds; bumping VERCEL_CLI_VERSION invalidates it.
      - name: Cache Vercel CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: vercel-cli-${{ env.VERCEL_CLI_VERSION }}

      - name: Install Vercel CLI
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.npm-global/bin:$PATH"
          if [ "$(vercel --version 2>/dev/null)" != "$VERCEL_CLI_VERSION" ]; then
            npm install -g "vercel@$VERCEL_CLI_VERSION"
          fi

      # There is deliberately NO `.next/cache` restore here any more.
      #
      # There was one until 2026-09-01, and the comment it carried had already
      # measured why it could not work: `next/font/google` under Turbopack lives
      # in Rust and re-fetches from Google on every build with no on-disk cache,
      # `turbopackPersistentCaching` is off so there is no compile cache, and the
      # build is Turbopack so there is no webpack cache either. What it actually
      # restored was `.tsbuildinfo`, the telemetry config and the image optimiser
      # folder — about 180 KB, none of which speeds up a build.
      #
      # That comment ended "the step is left alone", but it was defending the
      # step against the wrong charge: it was blamed for the 2026-08-13 font 404
      # and it was innocent of that. Innocent is not the same as useful. Measured
      # over the same run, it cost 3s to restore and 15s to upload, every run —
      # and 18s is what moved this job from 209s to under 180s, i.e. from four
      # billed minutes to three, on a plan the org was already 30% over.
      #
      # If you are tempted to add it back, measure what comes out of it first.

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # Retried, and retried ONLY for one specific upstream failure.
      #
      # `next/font/google` reaches out to Google at build time: it fetches the
      # stylesheet from fonts.googleapis.com, then fetches each `.woff2` the
      # stylesheet names from fonts.gstatic.com. Google serves that stylesheet
      # with `Cache-Control: private, max-age=86400, stale-while-revalidate=604800`,
      # so an edge may hand back a week-old copy — and Google 404s the old
      # gstatic filenames the moment it rebuilds a font binary. When the two
      # disagree the woff2 fetch 404s, Turbopack cannot create the font module,
      # and the build dies with "Module not found: Can't resolve
      # '@vercel/turbopack-next/internal/font/google/font'". That is what broke
      # the 2026-08-13 deploy (run 31741566251): the three Bricolage Grotesque
      # URLs in that log are dead, while the same request today returns
      # different, live URLs. Nothing in this repo changed.
      #
      # Next has no retry knob for this, so the retry is here. Waiting between
      # attempts is the point: the first request is what triggers Google's
      # background revalidation, so a later attempt is the one that can get a
      # fresh stylesheet. Any failure that does not carry the font-fetch
      # signature exits immediately — a genuine compile error must not be
      # rebuilt three times before it is reported.
      #
      # The durable fix is to stop fetching at build time at all: self-host the
      # three families with `next/font/local`. That is a separate change.
      - name: Build Project
        run: |
          log="$RUNNER_TEMP/vercel-build.log"
          attempt=1
          max=3
          while true; do
            echo "::group::vercel build --prod (attempt $attempt/$max)"
            if vercel build --prod --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tee "$log"; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if ! grep -qE 'fonts\.gstatic\.com|internal/font/google' "$log"; then
              echo "Build failed for a reason unrelated to next/font/google. Not retrying."
              exit 1
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::next/font/google could not fetch a Google font file after $max attempts. Google is serving a stylesheet whose .woff2 files no longer exist; see the comment above this step."
              exit 1
            fi
            echo "::warning::next/font/google font fetch failed (attempt $attempt/$max). Waiting 60s for Google to revalidate its stylesheet, then retrying."
            attempt=$((attempt + 1))
            sleep 60
          done

      - name: Deploy to Vercel
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to: $URL"
