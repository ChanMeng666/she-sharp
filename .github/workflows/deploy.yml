name: Deploy to Vercel

on:
  push:
    branches: [main]

env:
  VERCEL_ORG_ID: team_B067BUpWFoVPBxfQ0TWllunK
  VERCEL_PROJECT_ID: prj_DVjZnBzzL4tFpc5VME7bY6Q6wtAm

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # No `version:` here on purpose — `packageManager` in package.json is the
      # single source, so a local machine and CI cannot drift apart.
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # `vercel build` runs `next build` in this working directory, so Next.js
      # picks up `.next/cache` from here — without it every deploy re-compiles
      # from cold. Keyed on the lockfile plus every TS/TSX source so a source
      # change still restores the previous cache via `restore-keys` instead of
      # missing outright.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "Deployed to: $URL"
