name: Verify

on:
  pull_request:
    branches: [main]

jobs:
  # One job, not five. Every check below is offline and pure data, so they can
  # all share a single checkout and a single `pnpm install` — and on a private
  # repo that matters, because Actions bills EACH JOB rounded up to the next
  # whole minute. Measured 2026-09-01: the five jobs this replaced did 147s of
  # actual work behind 105s of duplicated setup (21s x 5) and billed
  # 2+1+2+2+1 = 8 minutes; as one job the same work bills 3. Verify was 66% of
  # this org's entire Actions spend while the org sat 30% over its 2,000-minute
  # monthly allowance — and running out takes `Deploy to Vercel` down with it.
  # Do not split this back into per-check jobs to make the checks list prettier;
  # add a step instead.
  #
  # Every check step carries `if: ${{ !cancelled() && steps.install.outcome ==
  # 'success' }}`, which is what buys back the one thing five jobs gave for
  # free: one red check no longer hides the next, so a single run still reports
  # every failure at once. Guarding on the install as well means a failed
  # install skips the checks instead of printing 22 identical errors.
  verify:
    runs-on: ubuntu-latest
    # Was the GitHub default of 360 minutes, on all five jobs. A single hung run
    # at that ceiling is 18% of the monthly allowance; this job measures under
    # three minutes.
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # No `version:` here on purpose — `packageManager` in package.json is the
      # single source, so a local machine and CI cannot drift apart.
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # `pnpm typecheck` existed in package.json but nothing ever ran it, so the
      # only thing compiling app code was the production deploy — i.e. after
      # merge, when a type break is already on `main`. `typecheck-scripts` above
      # covers the two trees the root tsconfig skips; this one covers everything
      # it does not: `app/`, `components/`, `lib/`, `hooks/`, `types/`, `proxy.ts`.
      # Deliberately a bare `tsc --noEmit` with no build in front of it — the
      # generated `.next/types` route types are the build's job, and paying for a
      # full Next build here would make the gate slower than the deploy it guards.
      - name: Type-check the app
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      # `scripts/` is excluded from the root tsconfig and `.claude/**` is missed by
      # its `**/*.ts` glob (dot-directories don't match), so neither tree was
      # type-checked by anything before this job. Both hold tooling teammates run
      # by hand — a break there is invisible until someone hits it mid-task.
      - name: Type-check scripts and skill tooling
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck:scripts

      # The repo had no ESLint config at all until this job existed, so nothing
      # caught the whole class of defect a linter sees: an unused disable
      # directive, a stray `require` in app code, a hook called outside a
      # component. The gate is errors-only — the presets' large legacy violation
      # counts are demoted to warnings in `eslint.config.mjs` and paid down
      # separately, so this job fails on new breakage rather than on history.
      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm lint

      # A deck fails in front of a room, at the worst possible moment. Two of the
      # things `deck.test.ts` asserts cannot be caught any other way: the feedback
      # QR is derived rather than authored, so no code review can see that a code
      # points at the wrong event or that two events collide onto one code. A
      # linter nothing runs is a linter nobody obeys. Needs no database and no
      # network — it is all pure data.
      - name: Check every registered slide deck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/deck/deck.test.ts

      - name: Verify image path integrity
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/verify-image-paths.ts

      # The other half of the guarantee above, and the half that gate
      # structurally cannot hold. A newsletter's event cards must carry ABSOLUTE
      # URLs — an email client has no site to resolve "/img/..." against — and
      # `scripts/assets/refs.ts` deliberately keeps absolute URLs out of the
      # reference corpus, because `lib/newsletter/render.test.ts` spells eleven
      # invented fixture paths that way (`/img/events/june.jpg`,
      # `/img/newsletter/cover-june.jpg`, …) and one regex cannot tell those from
      # the six real covers. So the six committed `cover-email.jpg` twins sit in
      # KNOWN_UNREFERENCED, whose only corpus reference is the allow-list entry
      # itself — which means `apply-move.ts` renames the entry along with the
      # file and leaves the issue fixture pointing at nothing. The gate above
      # then passes on all three checks while a cover reaches 1,545 inboxes
      # broken. This check reads the fixtures, so it sees that; it also fails
      # when the SOURCE image behind a twin has gone, which no reference corpus
      # can see. Pure filesystem — ffmpeg is only reached without --check.
      - name: Verify newsletter email-safe covers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/newsletter/email-covers.ts --check

      # Also shares this checkout — pure regex over the committed issue files,
      # no database and no network. Two subject lines have already reached the
      # whole list wrong and nothing in this repo could see either: `Newsletter
      # - April 2026 v0.2` went to 1,657 people on 2026-04-13 and cost 32
      # unsubscribes (1.93%, 14.5x the non-profit benchmark), and the June issue
      # went out on 2026-06-23 saying "May 2026". Every other protection around
      # the newsletter answers "may this go?" — the approval ledger, the
      # idempotency key, the frequency cap — and none of them reads the words.
      # This one does: draft version labels, a month that disagrees with the
      # issue's own id, Mailchimp merge tags the Resend path does not
      # substitute, template variables, placeholder text and dead links.
      - name: Verify newsletter copy carries no draft markers
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/email/content-lint.ts --all

      # The linter above is only worth its exit code if it still refuses the two
      # subject lines it was written for, so its test feeds it both verbatim —
      # and the three committed issues, which must come back clean. A linter
      # that refuses everything gets switched off before the next send.
      - name: Verify the newsletter content linter
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/email/content-lint.test.ts

      # The one check here whose failure NOTHING else can see. poster-type.ts
      # hands resvg four absolute font paths with `loadSystemFonts: false`, and
      # resvg does not raise on a path it cannot open — it renders in whatever
      # is left, and a poster set entirely in the wrong face looks deliberate.
      # `assertFamiliesDistinct()` does catch that, but only inside
      # build-event-poster.ts, which CI never runs; the two poster jobs below
      # import poster-type.ts and stay green because the files are read at
      # RENDER time. The fonts lived in report/fonts/ until 2026-09-01, when the
      # Typst projects left for NZ-SheSharp/she-sharp-reports — exactly the move
      # that would have gone green here and broken every poster locally.
      - name: Verify the poster fonts resolve
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/events/fonts.test.ts

      # The ownership check inside `verify-image-paths.ts` is generated from
      # resolveOwner(), which decides the event each of the ~170 files belongs
      # to. A wrong answer there is silent — the
      # file lands under the wrong event and every path still resolves — so the
      # ownership rules carry their own tests, built from the six real slug
      # prefix collisions rather than invented examples.
      - name: Verify event asset ownership rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/assets/event-assets.test.ts

      # Shares this job's checkout and install rather than paying for its own —
      # the check is pure data and takes under a second. It asserts the AI
      # Hackathon facts this repo publishes still match the shared list that the
      # separate Q&A assistant repo (event-qa-ai-template) checks itself
      # against. The two repos had silently disagreed on the Summit date, the
      # room numbers and the team size before this existed.
      - name: Verify shared hackathon facts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/check-hackathon-facts.ts

      # Also shares this checkout — it is pure data and offline. It guards the
      # rules that decide which Slack messages count as unread. Getting those
      # wrong does not fail loudly: it silently hands the model a short delta
      # and, worse, records the messages it skipped as read, so the next run has
      # nothing left to find. That happened on 4 Aug 2026 and cost an event
      # owner's entire review of a deck due on a projector three days later.
      - name: Verify Slack read-position rules
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx .claude/skills/sync-event-from-slack/scripts/state-lib.test.ts

      # The committed manifest must not claim the triage scored past content
      # nobody read. This is the invariant four separate misses violated; it is
      # pure data, so CI can hold it even though nothing here talks to Slack.
      - name: Verify nothing is left unread
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx .claude/skills/sync-event-from-slack/scripts/audit-read-state.ts

      # Also shares this checkout — offline and pure data. The lifecycle report
      # is the front door of the event pipeline: it reads several separate state
      # sources to say what is still outstanding for an event. Every one of them
      # is owned by something else, so the failure it must survive is a source
      # moving underneath it — a poster rebuilt under a new suffix, a deck slug
      # that stops matching its event, a ledger whose shape changed. The test
      # runs against the real repository data for exactly that reason. It also
      # holds the one check that can no longer be answered from a file: mail to
      # an event's registrants is sent from Humanitix and must read `n/a`, never
      # a `missing` nobody in this repo could ever clear.
      - name: Verify the event lifecycle report
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/events/event-status.test.ts

      # Offline and pure: the browser half of `verify-panel-contrast.ts` needs a
      # running site and a Playwright this repo deliberately does not depend on,
      # but the half that decides whether a surface is a card that vanished into
      # its own page is a function over measurements. That is the half that goes
      # wrong. Loosen one of its exclusions and the check goes quietly green on
      # the defect it exists for, which is how three form cards shipped
      # invisible in #271 and twelve more were found in #272.
      - name: Verify the panel-contrast classifier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/verify-panel-contrast.test.ts

      # Also shares this checkout — offline and pure data. /internal/event-playbook
      # serves a build-time snapshot of docs/development/EVENT_PLAYBOOK.md, which
      # is what keeps the markdown renderer out of the deployed bundle. The cost
      # is that the page can fall behind the document without looking any
      # different: it still renders, still reads as authoritative, and quietly
      # hands a volunteer a procedure that changed. The snapshot therefore
      # carries the hash of every source and this test recomputes them all.
      - name: Verify the playbook page matches its source document
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/docs/playbook.test.ts

      # Same snapshot arrangement, same failure, one page along:
      # /internal/email-playbook is built from
      # docs/development/INTERNAL_EMAIL_PLAYBOOK.md. Higher stakes than its
      # sibling — a stale page here tells somebody a group of real people may be
      # emailed when the rule has since said otherwise — so this one also checks
      # that the handbook still POINTS AT the three documents it summarises,
      # rather than having quietly become a second copy of them, and that no
      # section quotes a subscriber count without the date it was taken.
      - name: Verify the email playbook page matches its source document
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/docs/email-playbook.test.ts

      # Also shares this checkout — pure regex against two hard-coded lists.
      # An unreferenced image has two possible owners, the generated per-event
      # manifest and KNOWN_UNREFERENCED, and they mean different things. A file
      # claimed by both fails verify-image-paths as a stale allow-list entry —
      # but only once its event is next rebuilt, so the branch that widens a
      # pattern goes green and an unrelated branch weeks later goes red.
      - name: Verify poster asset ownership
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/events/poster-assets.test.ts

      # Also shares this checkout - pure HMAC over synthetic ids, no key beyond
      # the one the test sets itself and no network, which is why it is a step
      # here rather than a job. The mentee payment page cannot ask for a session
      # (the applicant has no account yet), so this token is the ONLY thing
      # between an anonymous caller and eleven applicants' names and addresses.
      # Until 2026-09-06 that page took the raw primary key and `?id=3`
      # answered. Most of the assertions hand the verifier something it must
      # refuse - a replayed signature on a neighbouring id, a flipped bit, a
      # truncated digest - because a signature check that accepts anything looks
      # exactly like one that works.
      - name: Verify mentee submission tokens
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/forms/submission-token.test.ts

      # Also shares this checkout. The raw Humanitix exports carry 5,156 real
      # names and 124 live access codes, so they can never be on CI — which is
      # exactly why the committed archive needs a check that survives without
      # them. It holds the archive to its own totals, requires every mapped site
      # slug to resolve to a real event, and refuses to let an address or a
      # code-shaped value reach lib/data/json/humanitix/. That last one is the
      # 2026-06-11 leak written down as a test rather than a habit.
      - name: Verify the Humanitix archive
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/data/humanitix.test.ts

      # Also shares this checkout — pure functions over synthetic order rows, no
      # key and no network, which is why it is a step here rather than a job.
      # It guards two things that fail SILENTLY: the six CSV headers, which
      # `normalize-recipients.ts` and `optin-rows.ts` each locate with a
      # `headers.find(...)` over an alias list, so a seventh column matching
      # either predicate would change which cell is read as the consent answer
      # or the consent date without anything throwing; and the `/orders` field
      # allowlist, whose reviver is the only reason a live access code, a mobile
      # and a postal address never enter the exporter's memory.
      - name: Verify the Humanitix opt-in exporter
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/humanitix/optin-orders.test.ts

      # Also shares this checkout, and the same argument applies harder. The
      # Humanitix export contains addresses; the Mailchimp audience export is
      # nothing but addresses — 3,689 of them, with names, phone numbers and the
      # IP each person signed up from. So the committed archive is counts only,
      # and this is the check that keeps it that way: no address, no IP, no
      # per-contact identifier, and no named bucket holding fewer than five
      # people, because a bucket of one is a person.
      - name: Verify the Mailchimp archive
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/data/mailchimp.test.ts

      # Also shares this checkout — pure functions over a stage table and a
      # countdown, no database and no network. The two refusals it covers stand
      # in front of a send that cannot be recalled: a campaign stage built at the
      # wrong distance from the event date ("last call" three weeks out), and two
      # stages colliding on one ledger key, which would make the ledger's
      # duplicate check block the SECOND stage of a campaign as "already sent".
      - name: Verify the event-announcement stages
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/email/event-announcement-spec.test.ts

      # Also shares this checkout — temp-file fixtures only, and it never reads
      # the committed state files. It holds the cross-skill marketing frequency
      # cap to its two load-bearing properties: it counts BOTH skills' ledgers
      # (counting one is the one-directional hole this closes) and an override
      # covers one key in one month, with a reason, or it is refused.
      - name: Verify the marketing frequency cap
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx .claude/skills/email-the-community/scripts/marketing-frequency-check.test.ts

      # Also shares this checkout, and it is the one Mailchimp check that has to
      # work the other way round. `lib/data/newsletter-archive/` holds 179 sent
      # emails, committed because the vault they came from is private and CI can
      # never regenerate them — so the thing CI defends is the file, not the run
      # that produced it. A sent email carries Mailchimp's unsubscribe footer,
      # its referral badge, a per-recipient `e=` parameter and, in two
      # campaigns, click tracking keyed to a real subscriber; none of that may
      # be republished from shesharp.org.nz. It also holds the join every
      # newsletter card on the site needs, which is what stops a card silently
      # pointing at a Mailchimp page after the subscription is cancelled.
      - name: Verify the on-site newsletter archive
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/mailchimp/archive-guard.test.ts

      # ---------------------------------------------------------------------
      # The seven tests nothing was running.
      #
      # On 2026-09-01 an audit of the 34 committed `*.test.ts` files found 19
      # that `verify.yml` never mentions. Eleven of those are the documented
      # local pre-push list in `docs/development/TESTING.md` — they want a
      # database, a running site, the private vault or the live web, so CI is
      # the wrong place for them and they stay out.
      #
      # The eight below that: in NEITHER list. Nothing ran them, ever, on any
      # machine, and two of them are the rules this repository is most careful
      # about — `selectMailable()` decides who may be sent a marketing email,
      # and `optin-rows.ts` decides which rows a route-2 import may write into
      # the consent record. They were tested and the tests gated nothing.
      #
      # That is not free to leave alone. The eighth orphan,
      # `scripts/events/poster-speaker.test.ts`, was RED on main and had been for
      # as long as nobody looked — which is the whole argument for this block. It
      # was not a layout limit and not bad data: the Les Mills roster it builds
      # from grew from four speakers to five, `buildLineup()` correctly laid out
      # five, and the assertion's hardcoded `4` went stale. It now asserts one
      # face per person on the roster, which is the property it was for, and it
      # is green and included below.
      #
      # Each was run with every secret unset before being added, because this
      # job has none. They are steps in THIS job rather than a job of their own
      # for the reason the file already gives: Actions bills each job rounded up
      # to the whole minute, so a step costs seconds and a job costs a minute.
      # ---------------------------------------------------------------------
      - name: Verify who may be mailed, and which rows an opt-in import may write
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx tsx scripts/email/mailable.test.ts
          npx tsx scripts/email/optin-rows.test.ts
          npx tsx scripts/email/restrict-hashes.test.ts

      # `lib/email/events.test.ts` is NOT here, and the reason is worth the line.
      # It imports `lib/email/events.ts`, which pulls in `lib/db/drizzle.ts`,
      # which throws on a missing `POSTGRES_URL` at module load — so it needs a
      # database-shaped environment even though its assertions are pure. It is
      # in the local pre-push list in `docs/development/TESTING.md` instead.
      - name: Verify the published sender addresses
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/email/published-addresses.test.ts

      - name: Verify the newsletter approval chain
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          npx tsx lib/email/newsletter-reviewers.test.ts
          npx tsx .claude/skills/monthly-newsletter/scripts/issue-ledger.test.ts

      - name: Verify the speaker poster layouts
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx scripts/events/poster-speaker.test.ts
      # Pure module, no database and no network — deliberately so it can be a
      # step here. `lib/email/hardening.test.ts` cannot be: reaching
      # `service.ts` pulls in `lib/db/drizzle.ts`, which throws at module load
      # without a connection string. That is the whole reason the loopback
      # guard was split into its own file rather than added to `service.ts`.
      #
      # It refuses the exact message that went out on 2026-09-01 — six
      # newsletter confirmations from noreply@shesharp.org.nz carrying
      # `http://localhost:3000/newsletter/confirm` links, because an end-to-end
      # test ran against a local server holding the production Resend key. The
      # batch path had guarded this since 2026-03-19 (25 mentor invitations);
      # the per-message path never had.
      - name: Verify no sent email can carry a localhost link
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/email/localhost-links.test.ts
      # Who answers a reply is decided by what the message is about, not by
      # which stream carried it — `lib/email/reply-to.ts`. Getting that wrong
      # has happened twice and looked fine in review both times: the marketing
      # Reply-To was `newsletter@`, a mailbox nobody had the password to, and
      # every transactional message replied to `mentoring@`, the mentorship
      # lead's own contact address. Pure module plus a source scan over the
      # sending files, so it can be a step here.
      - name: Verify every email replies to the right mailbox
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/email/reply-to.test.ts

      # Two Stripe payload properties moved between API versions and were being
      # read at their old locations through `as unknown as` casts, so `tsc` saw
      # nothing: subscription renewals became dead code and every membership
      # billing period was fabricated, both while the webhook answered 200. The
      # test feeds in payloads shaped the OLD way and asserts they read as null,
      # so a revert to the previous property path fails here. Pure functions, no
      # database and no network, so it belongs as a step in this job.
      - name: Verify Stripe payloads are read at their current locations
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/stripe/api-shape.test.ts

      # `DELETE /api/upload/{photo,cv}?url=...` is UNAUTHENTICATED - the public
      # mentorship and volunteer application forms call it - so the only thing
      # between a stranger and the organisation's Blob store is
      # `isOwnUploadUrl()`. Cloudinary's equivalent guard was a regex that only
      # had to fail open once. This test is the refusal suite: another host,
      # another Blob store, this store's other prefixes (the impact reports and
      # the newsletter photos live there too), a host that merely ends with the
      # store host, percent-encoded traversal, and a missing token, which must
      # fail CLOSED. Pure functions over a fictional token - no store, no
      # network, no secret - so it belongs as a step in this job.
      - name: Verify the upload-delete guard refuses foreign URLs
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npx tsx lib/blob/uploads.test.ts
