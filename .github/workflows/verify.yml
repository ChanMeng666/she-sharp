name: Verify

on:
  pull_request:
    branches: [main]

jobs:
  verify-image-paths:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # No `version:` here on purpose — `packageManager` in package.json is the
      # single source, so a local machine and CI cannot drift apart.
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify image path integrity
        run: npx tsx scripts/verify-image-paths.ts

      # Shares this job's checkout and install rather than paying for its own —
      # the check is pure data and takes under a second. It asserts the AI
      # Hackathon facts this repo publishes still match the shared list that the
      # separate Q&A assistant repo (event-qa-ai-template) checks itself
      # against. The two repos had silently disagreed on the Summit date, the
      # room numbers and the team size before this existed.
      - name: Verify shared hackathon facts
        run: npx tsx scripts/check-hackathon-facts.ts

      # Also shares this checkout — it is pure data and offline. It guards the
      # rules that decide which Slack messages count as unread. Getting those
      # wrong does not fail loudly: it silently hands the model a short delta
      # and, worse, records the messages it skipped as read, so the next run has
      # nothing left to find. That happened on 4 Aug 2026 and cost an event
      # owner's entire review of a deck due on a projector three days later.
      - name: Verify Slack read-position rules
        run: npx tsx .claude/skills/sync-event-from-slack/scripts/state-lib.test.ts

      # The committed manifest must not claim the triage scored past content
      # nobody read. This is the invariant four separate misses violated; it is
      # pure data, so CI can hold it even though nothing here talks to Slack.
      - name: Verify nothing is left unread
        run: npx tsx .claude/skills/sync-event-from-slack/scripts/audit-read-state.ts

  typecheck-scripts:
    # `scripts/` is excluded from the root tsconfig and `.claude/**` is missed by
    # its `**/*.ts` glob (dot-directories don't match), so neither tree was
    # type-checked by anything before this job. Both hold tooling teammates run
    # by hand — a break there is invisible until someone hits it mid-task.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # No `version:` here on purpose — `packageManager` in package.json is the
      # single source, so a local machine and CI cannot drift apart.
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check scripts and skill tooling
        run: pnpm typecheck:scripts

  deck-checks:
    # A deck fails in front of a room, at the worst possible moment. Two of the
    # things `deck.test.ts` asserts cannot be caught any other way: the feedback
    # QR is derived rather than authored, so no code review can see that a code
    # points at the wrong event or that two events collide onto one code. A
    # linter nothing runs is a linter nobody obeys. Needs no database and no
    # network — it is all pure data.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # No `version:` here on purpose — `packageManager` in package.json is the
      # single source, so a local machine and CI cannot drift apart.
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check every registered slide deck
        run: npx tsx lib/deck/deck.test.ts
