                      - paragraph [ref=e368]: Mike is a Digital Delivery Manager on the ICT Leadership team at Metlifecare, where he oversees the strategy and delivery of ICT solutions for new builds and property redevelopments. A dedicated advocate for women in tech, Mike has been a member of She Sharp since its inception in 2014. He oversees the charity's finances and physical assets, and is often seen taking photos at She Sharp events. Outside of his professional life, Mike enjoys time with his family, playing guitar, and has a passion for cooking and all things coffee.
