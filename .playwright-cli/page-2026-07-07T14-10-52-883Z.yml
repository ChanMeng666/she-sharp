                      - paragraph [ref=e424]: Ambassador | Industry
                      - paragraph [ref=e425]: Prasanth is an experienced Information Technology and Management professional with over 23 years of global expertise. Originally from Lutyens' Delhi, India, he has called New Zealand home for the past 17 years where he lives with his wife, two children, and their dog. Currently, he serves as a Senior Business Analyst in the Office of the Chief Technology Officer (OCTO) at Auckland University of Technology (AUT). His career includes past roles as a Capability Manager and management positions for large organisations. Beyond his professional endeavours, he contributes to the New Zealand community through coaching and mentoring young professionals for over a decade. His community involvement extends to Community Patrols NZ. He joined SheSharp to try and have a wider impact and make a difference for future generations. In his personal time, Prasanth enjoys playing badminton and exploring creative writing. As a son, husband, father, and brother, he is committed to sharing his experience while honouring both his heritage and the place he now calls home.
