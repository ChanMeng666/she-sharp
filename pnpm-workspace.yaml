# pnpm settings for this repo.
#
# `pnpm.overrides` in package.json is no longer read by pnpm 10.34+; overrides
# live here instead. This is a relocation only — the pin itself is unchanged.
#
# Why the pin exists: `baseline-browser-mapping` is pulled in transitively by
# the Next.js/browserslist toolchain, and an unpinned resolution once shipped a
# version that broke a production deploy. Do not drop this override without
# re-testing a full build.
#
# There is no `packages:` key on purpose — this is a single-package repo, not a
# workspace. The file exists solely to carry the override.
overrides:
  baseline-browser-mapping: ^2.9.3
