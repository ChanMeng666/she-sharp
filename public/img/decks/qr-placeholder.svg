<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="QR code placeholder — replace before the event">
  <title>QR placeholder</title>
  <desc>A deliberately unscannable stand-in for a QR code. Replace before the event.</desc>

  <defs>
    <!-- Diagonal hatch: the single strongest signal that this is not a code. -->
    <pattern id="qr-hatch" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="28" fill="none" />
      <rect width="10" height="28" fill="#9b2e83" opacity="0.16" />
    </pattern>
  </defs>

  <rect width="512" height="512" rx="40" fill="#ffffff" />
  <rect x="10" y="10" width="492" height="492" rx="32" fill="url(#qr-hatch)" />

  <!-- Brand frame, dashed so it never reads as a quiet zone. -->
  <rect x="10" y="10" width="492" height="492" rx="32" fill="none" stroke="#9b2e83" stroke-width="12" stroke-dasharray="34 22" stroke-linecap="round" />

  <!-- The three finder squares, in the corners a real code uses. -->
  <g fill="none" stroke="#9b2e83" stroke-width="16">
    <rect x="68" y="68" width="104" height="104" rx="12" />
    <rect x="340" y="68" width="104" height="104" rx="12" />
    <rect x="68" y="340" width="104" height="104" rx="12" />
  </g>
  <g fill="#9b2e83">
    <rect x="100" y="100" width="40" height="40" rx="6" />
    <rect x="372" y="100" width="40" height="40" rx="6" />
    <rect x="100" y="372" width="40" height="40" rx="6" />
  </g>

  <!-- Label plate. Opaque, so nothing behind it could ever resolve as data. -->
  <rect x="52" y="204" width="408" height="104" rx="20" fill="#9b2e83" />
  <text x="256" y="252" text-anchor="middle" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="44" font-weight="700" letter-spacing="2" fill="#ffffff">QR PLACEHOLDER</text>
  <text x="256" y="290" text-anchor="middle" font-family="Verdana, Geneva, DejaVu Sans, sans-serif" font-size="24" fill="#ffffff" opacity="0.92">Replace before the event</text>

  <!-- Bottom-right corner left empty on purpose: a real QR has no finder here,
       and the missing alignment block reinforces that this is a stand-in. -->
</svg>
